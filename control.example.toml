schema_version = 1

[server]
# Canonical browser origin used by Better Auth for cookies and callbacks.
public_url = "http://192.168.139.2:38080"
internal_url = "http://tali-control:38080"

[database]
url = "postgresql://tali:CHANGE_ME@postgresql:5432/tali"

[auth]
secret = "CHANGE_TO_AT_LEAST_32_RANDOM_CHARACTERS"

[auth.local]
enabled = true
initial_super_admin_username = "admin"
initial_super_admin_email = "admin@tasklattice.local"
initial_super_admin_password = "CHANGE_TO_A_STRONG_PASSWORD"

[auth.oidc]
enabled = false
display_name = "Keycloak SSO"
issuer = "http://keycloak:8080/realms/tali"
client_id = "tali-control-plane"
client_secret = "CHANGE_ME"

[runner]
url = "http://tali-runner:9090"
token = "CHANGE_ME"

[litellm]
url = "http://tali-litellm:4000"
master_key = "CHANGE_ME"

[runtime_namespaces]
enabled = true
cluster_id = "in-cluster"
# Must be unique to this Relay installation when sharing a Kubernetes cluster.
name_prefix = "tali-p"
reconcile_interval_seconds = 5
resync_interval_seconds = 300
deletion_timeout_seconds = 120

[smtp]
# SMTP is required for sending invitations to users who do not already have a
# TaskLattice Relay account. server.public_url must be browser-accessible when enabled.
enabled = false
host = "smtp.example.com"
port = 587
secure = false
username = "tali@example.com"
password = "CHANGE_ME"
from_address = "tali@example.com"
from_name = "TaskLattice Relay"
reply_to = "support@example.com"
