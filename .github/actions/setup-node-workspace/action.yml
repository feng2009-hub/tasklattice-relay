name: Set up Node workspace
description: Install the repository's Node.js toolchain with the shared npm download cache.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install workspace dependencies
      shell: bash
      run: npm ci
