name: Release images and Helm chart

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: npm run helm:dependencies
      - run: helm lint charts/tali-relay
      - run: npm run helm:validate:resources
      - run: npm run helm:validate:openshift
      - run: npm run helm:validate:airgap
      - run: helm template tali-relay charts/tali-relay --namespace tali --kube-version 1.29.0 > /dev/null
      - name: Render embedded Keycloak test mode
        run: >-
          helm template tali-relay charts/tali-relay
          --namespace tali
          --kube-version 1.29.0
          --set control.publicUrl=http://192.0.2.10
          --set keycloak.enabled=true
          --set keycloak.publicUrl=http://192.0.2.11:8080
          > /dev/null

  publish-core-platforms:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tali-control
            dockerfile: infra/docker/Dockerfile
            target: control
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-control
            dockerfile: infra/docker/Dockerfile
            target: control
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: tali-openshell-runner
            dockerfile: infra/docker/Dockerfile
            target: runner
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-openshell-runner
            dockerfile: infra/docker/Dockerfile
            target: runner
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: tali-litellm
            dockerfile: infra/docker/Dockerfile.litellm
            target: ""
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-litellm
            dockerfile: infra/docker/Dockerfile.litellm
            target: ""
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: tali-example-mcp
            dockerfile: infra/docker/Dockerfile
            target: example-mcp
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-example-mcp
            dockerfile: infra/docker/Dockerfile
            target: example-mcp
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
        if: matrix.image == 'tali-control'
        with:
          version: v3.18.4
      - name: Package Helm chart for Control Plane image
        if: matrix.image == 'tali-control'
        shell: bash
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TALI_IMAGE_REGISTRY="${registry}" \
            bash scripts/package-control-plane-chart.sh "${GITHUB_REF_NAME#v}"
      - id: image
        name: Resolve image tags
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="${registry}/${{ matrix.image }}"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "name=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:${version}-${{ matrix.architecture }}"
            echo "${image}:sha-${short_sha}-${{ matrix.architecture }}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

  publish-core-manifests:
    needs: publish-core-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - tali-control
          - tali-openshell-runner
          - tali-litellm
          - tali-example-mcp
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          docker buildx imagetools create --tag "${image}:${version}" "${sources[@]}"
          docker buildx imagetools create --tag "${image}:sha-${short_sha}" "${sources[@]}"
          if [[ "${version}" != *-* ]]; then
            docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
          fi

  publish-sandbox-platforms:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: openclaw
            architecture: amd64
            runner: ubuntu-24.04
          - agent: openclaw
            architecture: arm64
            runner: ubuntu-24.04-arm
          - agent: hermes
            architecture: amd64
            runner: ubuntu-24.04
          - agent: hermes
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.architecture }}
          NEMOCLAW_AGENT_PLATFORM: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          if [[ "${NEMOCLAW_AGENT_PLATFORM}" == "openclaw" ]]; then
            image="${registry}/tali-nemoclaw-sandbox"
            export NEMOCLAW_IMAGE="${image}:${version}-${{ matrix.architecture }}"
          else
            image="${registry}/tali-nemoclaw-hermes-sandbox"
            export NEMOCLAW_HERMES_IMAGE="${image}:${version}-${{ matrix.architecture }}"
          fi
          export NEMOCLAW_BUILD_OUTPUT=push
          export NEMOCLAW_UPSTREAM_IMAGE="${image}:build-upstream-${short_sha}-${{ matrix.architecture }}"
          export NEMOCLAW_FALLBACK_BASE_IMAGE="${image}:build-base-${short_sha}-${{ matrix.architecture }}"
          bash scripts/build-nemoclaw-sandbox.sh

  publish-sandbox-manifests:
    needs: publish-sandbox-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - tali-nemoclaw-sandbox
          - tali-nemoclaw-hermes-sandbox
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          docker buildx imagetools create --tag "${image}:${version}" "${sources[@]}"
          docker buildx imagetools create --tag "${image}:sha-${short_sha}" "${sources[@]}"
          if [[ "${version}" != *-* ]]; then
            docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
          fi

  release:
    needs: [publish-core-manifests, publish-sandbox-manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p dist
          TALI_IMAGE_REGISTRY="${registry}" \
            bash scripts/package-control-plane-chart.sh "${version}"
          cp dist/control-plane-chart/tali-relay.tgz "dist/tali-relay-${version}.tgz"
          helm push "dist/tali-relay-${version}.tgz" "oci://${registry}/charts"
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="dist/tali-relay-${version}.tgz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${asset}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${asset}" \
              --verify-tag \
              --generate-notes \
              --title "TaskLattice Relay ${version}"
          fi
