name: Helm chart Kind smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/helm-kind-smoke.yml"
      - "charts/tali-relay/**"
      - "scripts/helm-kind-smoke.sh"
      - "scripts/prepare-helm-dependencies.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helm-kind-smoke.yml"
      - "charts/tali-relay/**"
      - "scripts/helm-kind-smoke.sh"
      - "scripts/prepare-helm-dependencies.sh"
  workflow_run:
    workflows:
      - "Release images and Helm chart"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: helm-kind-smoke-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_CLUSTER_NAME: tali-ci
  HELM_RELEASE_NAME: tali
  HELM_NAMESPACE: tali-smoke
  HELM_TIMEOUT: 15m

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: smoke-inputs
        name: Resolve chart and image inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          image_registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release workflow did not report a semantic version tag: ${RELEASE_TAG}" >&2
              exit 2
            fi
            version="${RELEASE_TAG#v}"
            chart_directory="${RUNNER_TEMP}/release-chart"
            chart_path="${chart_directory}/tali-relay-${version}.tgz"
            mkdir -p "${chart_directory}"
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "tali-relay-${version}.tgz" \
              --dir "${chart_directory}"
            test -f "${chart_path}"
            control_image_tag="${version}"
            control_image_pull_policy="Always"
            image_tag="${version}"
          else
            chart_path="${GITHUB_WORKSPACE}/charts/tali-relay"
            control_image_tag="ci-${GITHUB_SHA}"
            control_image_pull_policy="Never"
            image_tag="latest"
          fi
          {
            echo "chart_path=${chart_path}"
            echo "control_image_tag=${control_image_tag}"
            echo "control_image_pull_policy=${control_image_pull_policy}"
            echo "image_registry=${image_registry}"
            echo "image_tag=${image_tag}"
          } >> "${GITHUB_OUTPUT}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
          kubectl_version: v1.32.0
          cluster_name: tali-ci
          node_image: kindest/node:v1.32.0@sha256:c48c62eac5da28cdadcf560d1d8616cfa6783b58f0d94cf63ad1bf49600cb027
          wait: 120s

      - name: Build and load current Control Plane image
        if: github.event_name != 'workflow_run'
        shell: bash
        env:
          CONTROL_IMAGE_TAG: ${{ steps.smoke-inputs.outputs.control_image_tag }}
          IMAGE_REGISTRY: ${{ steps.smoke-inputs.outputs.image_registry }}
        run: |
          set -euo pipefail
          control_image="${IMAGE_REGISTRY}/tali-control:${CONTROL_IMAGE_TAG}"
          bash scripts/package-control-plane-chart.sh
          docker build \
            --file infra/docker/Dockerfile \
            --target control \
            --tag "${control_image}" \
            .
          docker run --rm --entrypoint test "${control_image}" \
            -f /app/apps/control/.output/workers/control-worker.mjs
          docker run --rm --entrypoint test "${control_image}" \
            -f /app/apps/control/.output/tools/project-runtime-reconcile.mjs
          kind load docker-image \
            --name "${KIND_CLUSTER_NAME}" \
            "${control_image}"

      - name: Install chart and wait for healthy Pods
        env:
          CONTROL_IMAGE_PULL_POLICY: ${{ steps.smoke-inputs.outputs.control_image_pull_policy }}
          CONTROL_IMAGE_TAG: ${{ steps.smoke-inputs.outputs.control_image_tag }}
          HELM_CHART_PATH: ${{ steps.smoke-inputs.outputs.chart_path }}
          IMAGE_REGISTRY: ${{ steps.smoke-inputs.outputs.image_registry }}
          IMAGE_TAG: ${{ steps.smoke-inputs.outputs.image_tag }}
        run: bash scripts/helm-kind-smoke.sh

      - name: Collect failure diagnostics
        if: failure()
        run: |
          kubectl get pods,services,pvc --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp || true
          helm --namespace "${HELM_NAMESPACE}" status "${HELM_RELEASE_NAME}" || true
          kubectl --namespace "${HELM_NAMESPACE}" describe pods || true
          kubectl --namespace "${HELM_NAMESPACE}" logs \
            --selector "app.kubernetes.io/instance=${HELM_RELEASE_NAME}" \
            --all-containers \
            --prefix \
            --tail 200 || true
