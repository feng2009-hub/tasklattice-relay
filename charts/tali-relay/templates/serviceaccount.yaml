{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tali.serviceAccountName" . }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tali.serviceAccountName" . }}-managed-secrets
  labels:
    {{- include "tali.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tali.serviceAccountName" . }}-managed-secrets
  labels:
    {{- include "tali.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tali.serviceAccountName" . }}-managed-secrets
{{- end }}
{{- if .Values.serviceAccount.runtime.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tali.runtimeServiceAccountName" . }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.runtime.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
