{{- if .Values.projectRuntimeNamespaces.enabled }}
{{- $component := "project-runtime-controller" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- $clusterScopeId := printf "%s/%s" .Release.Namespace $name -}}
{{- $clusterRoleName := printf "%s-%s" ($name | trunc 48 | trimSuffix "-") ($clusterScopeId | sha256sum | trunc 12) -}}
{{- $cleanupComponent := "project-runtime-cleanup" -}}
{{- $cleanupName := include "tali.componentName" (dict "root" . "component" $cleanupComponent) -}}
{{- $cleanupClusterScopeId := printf "%s/%s" .Release.Namespace $cleanupName -}}
{{- $cleanupClusterRoleName := printf "%s-%s" ($cleanupName | trunc 48 | trimSuffix "-") ($cleanupClusterScopeId | sha256sum | trunc 12) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tali.projectRuntimeServiceAccountName" . }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.projectRuntimeServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
---
{{- if .Values.control.deletionWorker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tali.projectRuntimeCleanupServiceAccountName" . }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $cleanupComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cleanupClusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $cleanupComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cleanupClusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $cleanupComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.projectRuntimeCleanupServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cleanupClusterRoleName }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "application") | nindent 4 }}
spec:
  replicas: {{ .Values.projectRuntimeNamespaces.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/control-config: {{ include "tali.controlConfigChecksum" . }}
        {{- with .Values.global.rolloutRevision }}
        tali.ai/rollout-revision: {{ . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "tali.projectRuntimeServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-control-database
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          workingDir: /app/apps/control
          command:
            - /app/node_modules/.bin/prisma
            - migrate
            - deploy
            - --config
            - prisma.config.ts
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.control.initResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
      containers:
        - name: project-runtime-controller
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          command:
            - node
            - apps/control/.output/workers/project-runtime-target-worker.mjs
          env:
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
          resources:
            {{- toYaml .Values.projectRuntimeNamespaces.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: control-config
          secret:
            secretName: {{ include "tali.secretName" . }}
            items:
              - key: control.toml
                path: control.toml
{{- end }}
