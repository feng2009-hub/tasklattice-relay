{{- if .Values.keycloak.enabled }}
{{- if .Values.secrets.existingSecret }}
{{- fail "keycloak.enabled cannot be combined with secrets.existingSecret because the chart must generate the connected control.toml and Keycloak test credentials" }}
{{- end }}
{{- if not .Values.keycloak.testUsers }}
{{- fail "keycloak.testUsers must contain at least one complete test user when the embedded Keycloak is enabled" }}
{{- end }}
{{- $component := "keycloak" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- $publicUrl := trimSuffix "/" (required "keycloak.publicUrl is required when the embedded Keycloak is enabled" .Values.keycloak.publicUrl) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
data:
  tali-realm.json: |
    {
      "realm": "tali",
      "displayName": "TaskLattice Relay Test",
      "enabled": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "clients": [
        {
          "clientId": "tali-control-plane",
          "name": "TaskLattice Relay Control Plane",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${TALI_KEYCLOAK_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            {{ printf "%s/auth/sso/callback" (trimSuffix "/" .Values.control.publicUrl) | quote }}
          ],
          "webOrigins": [
            {{ trimSuffix "/" .Values.control.publicUrl | quote }}
          ],
          "attributes": {
            "post.logout.redirect.uris": {{ printf "%s/*" (trimSuffix "/" .Values.control.publicUrl) | quote }}
          }
        }
      ],
      "users": [
        {{- range $index, $user := .Values.keycloak.testUsers }}
        {{- if $index }},{{ end }}
        {
          {{- with $user.id }}
          "id": {{ . | quote }},
          {{- end }}
          "username": {{ required "every keycloak.testUsers entry requires username" $user.username | quote }},
          "email": {{ required "every keycloak.testUsers entry requires email" $user.email | quote }},
          "firstName": {{ required "every keycloak.testUsers entry requires firstName" $user.firstName | quote }},
          "lastName": {{ required "every keycloak.testUsers entry requires lastName" $user.lastName | quote }},
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "${TALI_KEYCLOAK_TEST_USER_PASSWORD}",
              "temporary": false
            }
          ]
        }
        {{- end }}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/realm: {{ printf "%s:%s" (toJson .Values.keycloak) .Values.control.publicUrl | sha256sum }}
        checksum/keycloak-secret: {{ include "tali.keycloakSecretChecksum" . }}
    spec:
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.keycloak) }}
          imagePullPolicy: {{ .Values.images.keycloak.pullPolicy }}
          args:
            - start-dev
            - --import-realm
            - --hostname={{ $publicUrl }}
            - --health-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ required "keycloak.adminUsername is required when the embedded Keycloak is enabled" .Values.keycloak.adminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: keycloak-admin-password
            - name: TALI_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: keycloak-client-secret
            - name: TALI_KEYCLOAK_TEST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: keycloak-test-user-password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/tali-realm.json
              subPath: tali-realm.json
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ $name }}-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  {{- with .Values.keycloak.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.keycloak.service.type }}
  {{- with .Values.keycloak.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
{{- end }}
