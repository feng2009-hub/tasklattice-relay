apiVersion: v2
name: tali
description: TaskLattice Relay control plane, model gateway, and OpenShell agent runtime
type: application
version: 0.0.0-dev
appVersion: dev
kubeVersion: ">=1.29.0-0"
home: https://github.com/tasklattice/tasklattice-relay
sources:
  - https://github.com/tasklattice/tasklattice-relay
dependencies:
  - name: helm-chart
    alias: openshell
    version: 0.0.82
    repository: oci://ghcr.io/nvidia/openshell
    condition: openshell.enabled
  - name: agent-sandbox
    alias: agentSandbox
    version: 0.1.0
    repository: file://../../.helm-dependencies/agent-sandbox
    condition: agentSandbox.enabled
