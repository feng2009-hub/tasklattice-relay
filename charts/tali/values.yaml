serviceAccount:
  create: true
  name: ""
  annotations: {}
  runtime:
    create: true
    name: ""
    annotations: {}

nameOverride: ""
fullnameOverride: ""

# Default CPU and memory values for containers created by runtime dependencies
# that do not expose per-container resource settings (for example, OpenShell's
# dynamically injected sandbox init containers). Disable this only when the
# target namespace already has an equivalent platform-managed LimitRange.
resourceDefaults:
  enabled: true
  defaultRequest:
    cpu: 10m
    memory: 32Mi
  default:
    cpu: 500m
    memory: 512Mi

# Pinned kubernetes-sigs/agent-sandbox v0.5.1 dependency. Its upstream Chart is
# fetched and packaged by scripts/prepare-helm-dependencies.sh; upstream source
# is not copied into this repository.
agentSandbox:
  enabled: true
  imagePullSecrets: []
  namespace:
    create: true
    name: agent-sandbox-system
  image:
    repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    tag: v0.5.1
    pullPolicy: IfNotPresent
  controller:
    leaderElect: true
    extensions: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Pinned upstream OpenShell OCI chart. Plaintext/unauthenticated mode matches
# TaskLattice Relay's current trusted-cluster integration. Put the services behind an
# authenticated ingress or configure OpenShell TLS/OIDC for shared clusters.
openshell:
  enabled: true
  image:
    tag: 0.0.82
  supervisor:
    image:
      tag: 0.0.82
    sideloadMethod: init-container
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  server:
    disableTls: true
    auth:
      allowUnauthenticatedUsers: true
    workspaceDefaultStorageSize: 1Gi
