{{- if and .Values.openshift.enabled .Values.openshift.sandboxScc.createRoleBinding .Values.openshell.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tasklattice.componentName" (dict "root" . "component" "openshell-sandbox-privileged") }}
  labels:
    {{- include "tasklattice.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell.sandboxServiceAccountName" .Subcharts.openshell }}
    namespace: {{ .Release.Namespace }}
{{- end }}
