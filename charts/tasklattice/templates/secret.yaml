{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasklattice.secretName" . }}
  labels:
    {{- include "tasklattice.labels" . | nindent 4 }}
type: Opaque
stringData:
  runner-token: {{ required "secrets.runnerToken is required" .Values.secrets.runnerToken | quote }}
  litellm-master-key: {{ required "secrets.litellmMasterKey is required" .Values.secrets.litellmMasterKey | quote }}
  model-guardrails-api-key: {{ required "secrets.modelGuardrailsApiKey is required" .Values.secrets.modelGuardrailsApiKey | quote }}
  {{- if and .Values.modelGuardrails.nvidia.enabled (not .Values.modelGuardrails.nvidia.apiKeySecretName) }}
  model-guardrails-nvidia-api-key: {{ required "secrets.modelGuardrailsNvidiaApiKey is required when NVIDIA Model Guardrails are enabled" .Values.secrets.modelGuardrailsNvidiaApiKey | quote }}
  {{- end }}
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  database-url: {{ include "tasklattice.databaseUrl" . | quote }}
  control.toml: |
{{ include "tasklattice.controlConfig" . | indent 4 }}
  litellm-config.yaml: |
    guardrails:
      - guardrail_name: tasklattice-model-input
        litellm_params:
          guardrail: generic_guardrail_api
          mode: pre_call
          default_on: false
          api_base: {{ printf "http://%s:%v" (include "tasklattice.componentName" (dict "root" . "component" "model-guardrails")) .Values.modelGuardrails.service.port | quote }}
          api_key: {{ .Values.secrets.modelGuardrailsApiKey | quote }}
          unreachable_fallback: fail_closed
          additional_provider_specific_params:
            tasklattice_lifecycle_phase: pre_call
      - guardrail_name: tasklattice-model-during-call
        litellm_params:
          guardrail: generic_guardrail_api
          mode: during_call
          default_on: false
          api_base: {{ printf "http://%s:%v" (include "tasklattice.componentName" (dict "root" . "component" "model-guardrails")) .Values.modelGuardrails.service.port | quote }}
          api_key: {{ .Values.secrets.modelGuardrailsApiKey | quote }}
          unreachable_fallback: fail_closed
          additional_provider_specific_params:
            tasklattice_lifecycle_phase: during_call
      - guardrail_name: tasklattice-model-output
        litellm_params:
          guardrail: generic_guardrail_api
          mode: post_call
          default_on: false
          api_base: {{ printf "http://%s:%v" (include "tasklattice.componentName" (dict "root" . "component" "model-guardrails")) .Values.modelGuardrails.service.port | quote }}
          api_key: {{ .Values.secrets.modelGuardrailsApiKey | quote }}
          unreachable_fallback: fail_closed
          additional_provider_specific_params:
            tasklattice_lifecycle_phase: post_call
  {{- if .Values.keycloak.enabled }}
  keycloak-admin-password: {{ required "secrets.keycloakAdminPassword is required when the embedded Keycloak is enabled" .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-client-secret: {{ required "secrets.keycloakClientSecret is required when the embedded Keycloak is enabled" .Values.secrets.keycloakClientSecret | quote }}
  keycloak-test-user-password: {{ required "secrets.keycloakTestUserPassword is required when the embedded Keycloak is enabled" .Values.secrets.keycloakTestUserPassword | quote }}
  {{- end }}
  litellm-ui-username: {{ .Values.secrets.litellmUiUsername | quote }}
  litellm-ui-password: {{ .Values.secrets.litellmUiPassword | quote }}
  litellm-salt-key: {{ .Values.secrets.litellmSaltKey | quote }}
{{- end }}
