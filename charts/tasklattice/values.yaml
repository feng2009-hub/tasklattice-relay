serviceAccount:
  create: true
  name: ""
  annotations: {}

nameOverride: ""
fullnameOverride: ""

# Cluster-scoped runtime dependency. Set enabled=false when it is already
# installed in the cluster. The vendored upstream chart is pinned to v0.5.1 by
# the image tag even though its upstream Chart version remains 0.1.0.
agentSandbox:
  enabled: true
  namespace:
    create: true
    name: agent-sandbox-system
  image:
    repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    tag: v0.5.1
    pullPolicy: IfNotPresent
  controller:
    leaderElect: true
    extensions: false

# Pinned upstream OpenShell OCI chart. Plaintext/unauthenticated mode matches
# TaskLattice's current trusted-cluster integration. Put the services behind an
# authenticated ingress or configure OpenShell TLS/OIDC for shared clusters.
openshell:
  enabled: true
  image:
    tag: 0.0.82
  supervisor:
    image:
      tag: 0.0.82
    sideloadMethod: init-container
  service:
    type: LoadBalancer
  server:
    disableTls: true
    auth:
      allowUnauthenticatedUsers: true
    workspaceDefaultStorageSize: 1Gi
